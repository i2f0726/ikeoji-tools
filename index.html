<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イケオジ計画のツール</title>
<meta name="description" content="イケオジ計画のセルフチェック・診断ツールの一覧です。">
<style>
  :root { --navy:#1a2744; --gold:#c9a44c; --ivory:#faf7ef; --ink:#1f2430; --muted:#5b6170; --line:#e4dccb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ivory); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif; line-height:1.8; }
  header { background:var(--navy); color:#fff; padding:28px 16px 24px; text-align:center; }
  header p { margin:0; color:var(--gold); font-size:13px; letter-spacing:.1em; }
  header h1 { margin:6px 0 0; font-size:22px; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  a.card { display:block; background:#fff; border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:16px 18px; margin-bottom:14px; color:inherit; text-decoration:none; }
  a.card strong { color:var(--navy); font-size:17px; }
  a.card span { display:block; color:var(--muted); font-size:14px; }
  footer { text-align:center; font-size:13px; color:var(--muted); padding:0 16px 32px; }
  footer a { color:var(--navy); }
</style>
</head>
<body>
<header><p>IKEOJI KEIKAKU</p><h1>イケオジ計画のツール</h1></header>
<main>
  <a class="card" href="face/"><strong>顔の形スキャン</strong><span>スマホのカメラで顔の縦横の比率を測り、顔の形の目安と、似合いやすい髪型の方向性を出します。</span></a>
  <a class="card" href="check/"><strong>清潔感セルフチェック（イケオジ指数診断）</strong><span>30項目をチェックして、清潔感の見落としを確認します。</span></a>
</main>
<footer><a href="https://www.ikeojikeikaku.com/">イケオジ計画（ブログ）へ戻る</a></footer>
</body>
</html>
